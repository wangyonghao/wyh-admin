name: Backend Build

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        jdk-version:
          - 17
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ matrix.jdk-version }}
          cache: "maven"
      - name: Use Maven Central
        run: |
          sed -i.bak '/<repositories>/,/<\/repositories>/d' ./backend/pom.xml
          sed -i.bak '/<pluginRepositories>/,/<\/pluginRepositories>/d' ./backend/pom.xml
      - name: Compile
        run: mvn -B compile --file ./backend/pom.xml
      - name: Unit tests
        # 模块坐标随仓库拆分更新：commons/* + admin-system-client
        run: mvn -B -pl commons/cmn-job,commons/cmn-web,commons/cmn-db,commons/cmn-cache,commons/cmn-crypto,admin-system-client -am test --file ./backend/pom.xml
